name: passeidireito
description: "Estudo gamificado para o concurso de Procurador do Município de Curitiba (Edital 6/2026)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Uma pasta por materia. O validador (tools/validar_questoes.py) confere
  # cada arquivo antes de ele entrar aqui.
  assets:
    - assets/questoes/adm/
