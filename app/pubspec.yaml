name: passeidireito
description: "Estudo gamificado para o concurso de Procurador do Município de Curitiba (Edital 6/2026)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true

  # Uma pasta por materia. O validador (tools/validar_questoes.py) confere
  # cada arquivo antes de ele entrar aqui.
  assets:
    - assets/questoes/adm/
    - assets/questoes/const/
    - assets/questoes/trib/
    - assets/questoes/pc/

  # Embutidas para funcionar offline. Licença OFL, em assets/fontes/.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fontes/IBMPlexSans-Regular.ttf
        - asset: assets/fontes/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fontes/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: SourceSerif4
      fonts:
        - asset: assets/fontes/SourceSerif4-Semibold.ttf
          weight: 600
